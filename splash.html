<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01 · Splash Appadoka</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#fff9f5;color:#5b3a2e;font-family:system-ui,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.stage{position:relative;width:min(100%,390px);aspect-ratio:390/844;margin:18px auto;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#fff1e9,#fde6db 55%,#fbdccf);border-radius:22px;isolation:isolate}.pattern{position:absolute;inset:0;background:url('assets/brand/oficiais/16-padrao-coracoes-vapor.svg') 0 0/28% auto repeat;opacity:.07}.logo{position:absolute;left:10%;top:28%;width:80%;aspect-ratio:976/688}.logo img{position:absolute;inset:0;width:100%;height:auto;opacity:0}.logo img:first-child{opacity:1}.orn{position:absolute;top:62%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}.orn img:first-child{height:22px}.orn img:last-child{height:30px}.art{position:absolute;inset:0;transition:opacity .45s ease}.art.out{opacity:0}.art.run .logo img:nth-child(1){animation:f1 900ms steps(1,end) infinite}.art.run .logo img:nth-child(2){animation:f2 900ms steps(1,end) infinite}.art.run .logo img:nth-child(3){animation:f3 900ms steps(1,end) infinite}@keyframes f1{0%,100%{opacity:1}33.333333%{opacity:0}}@keyframes f2{0%,100%{opacity:0}33.333333%{opacity:1}66.666667%{opacity:0}}@keyframes f3{0%,100%{opacity:0}66.666667%{opacity:1}}@media(prefers-reduced-motion:reduce){.art.run .logo img{animation:none;opacity:0}.art.run .logo img:first-child{opacity:1}.art{transition:none}}button{min-height:44px;padding:10px 20px;border:1px solid #aa7a6c;border-radius:12px;background:#fff1e9;color:#5b3a2e;font-weight:700}p{font-size:.9rem}</style></head><body><main class="wrap"><a href="curadoria.html">← Curadoria</a><h1>C01 · Splash animada</h1><p>Prévia para avaliação · fundo transparente aprovado, composição pendente.</p><div class="stage"><div class="art" id="art"><div class="pattern"></div><div class="logo"><img src="assets/importados/appadoka-beta/public/brand/derivados/animacao/quadro-abertura-pao-inteiro-contorno-uniforme-v1.png" alt="Appadoka"><img src="assets/importados/appadoka-beta/public/brand/derivados/animacao/quadro-abertura-primeira-mordida-contorno-uniforme-v1.png" alt=""><img src="assets/importados/appadoka-beta/public/brand/derivados/animacao/quadro-abertura-segunda-mordida-contorno-uniforme-v1.png" alt=""></div><div class="orn"><img src="assets/importados/appadoka-beta/public/brand/06_linhas_velocidade.png" alt=""><img src="assets/importados/appadoka-beta/public/brand/08_onda_coracoes.png" alt=""></div></div></div><button id="replay">Reproduzir novamente</button> <button id="loop" aria-pressed="false">Loop contínuo</button><p>300 ms por quadro · ciclo de 900 ms · 3,3 s de exibição + saída de 500 ms.</p><p id="state" role="status"></p></main><script>const art=document.getElementById('art'),state=document.getElementById('state'),loop=document.getElementById('loop');let timer,end,continuous=false;function play(){clearTimeout(timer);clearTimeout(end);art.className='art';void art.offsetWidth;art.classList.add('run');state.textContent=continuous?'Loop contínuo':'Reproduzindo';if(!continuous){timer=setTimeout(()=>art.classList.add('out'),3300);end=setTimeout(()=>{art.classList.remove('run');state.textContent='Animação concluída'},3800)}}document.getElementById('replay').onclick=play;loop.onclick=()=>{continuous=!continuous;loop.setAttribute('aria-pressed',String(continuous));loop.textContent=continuous?'Desativar loop':'Loop contínuo';play()};Promise.all([...art.querySelectorAll('img')].map(i=>i.decode())).then(play).catch(()=>state.textContent='Não foi possível carregar todos os quadros.');</script></body></html>
